name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Production and PR previews share one gh-pages branch, so their pushes have to
# be serialized. Never cancel — a dropped run leaves the site a build behind.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Pinned to the versions in package.json `engines`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24.22.1

      - name: Run Install
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm run build

      # keep_files so publishing production doesn't wipe the pr-preview/
      # folders sitting alongside it on the branch.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
