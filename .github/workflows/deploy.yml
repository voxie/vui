name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Pinned to the versions in package.json `engines`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24.19.0

      - name: Run Install
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
